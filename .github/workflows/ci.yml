name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The restore tests need the siblings; one command, so opensearch-mcp's sift-common comes from its branch
      - run: pip install "sift-common @ git+https://github.com/AppliedIR/sift-mcp.git#subdirectory=packages/sift-common" "opensearch-mcp @ git+https://github.com/AppliedIR/opensearch-mcp.git"
      # A hang ends the step on its own: the log still uploads and faulthandler names the stuck test
      - run: timeout 1200 pytest tests/ -v --tb=short -o faulthandler_timeout=300
